# Qwen3-Omni-MoE on 2x L40S with FP8 quantization + duplex.
# Thinker (stage 0) on GPU 0 with FP8.
# Talker + Code2Wav (stages 1,2) on GPU 1.
#
pipeline: qwen3_omni_moe
session_mode: duplex
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

duplex_session:
  idle_ttl_s: 300
  disconnect_grace_s: 30
  reaper_interval_s: 5
  max_sessions: 2

stages:
  - stage_id: 0
    quantization: fp8
    max_model_len: 4096
    max_num_batched_tokens: 4096
    max_num_seqs: 2
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
      stop_token_ids: [151645]

  - stage_id: 1
    max_model_len: 4096
    max_num_batched_tokens: 4096
    max_num_seqs: 2
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    compilation_config:
      cudagraph_mode: PIECEWISE
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 8192
      repetition_penalty: 1.05
      stop_token_ids: [2150]

  - stage_id: 2
    max_model_len: 4096
    max_num_batched_tokens: 4096
    max_num_seqs: 2
    gpu_memory_utilization: 0.1
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "1"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.1
